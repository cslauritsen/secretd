[package]
name = "secret"
description = "Client CLI for secretd: get, list, inject"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "secret"
path = "src/main.rs"

[dependencies]
secret-client = { path = "../secret-client" }
secret-proto = { path = "../secret-proto" }
anyhow.workspace = true
clap.workspace = true
zeroize.workspace = true
libc.workspace = true

[dev-dependencies]
secret-proto = { path = "../secret-proto", features = ["server"] }
secretd = { path = "../secretd" }
async-trait = "0.1"
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
