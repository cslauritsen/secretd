[package]
name = "secretd"
description = "Local secrets-release daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "secretd"
path = "src/lib.rs"

[[bin]]
name = "secretd"
path = "src/main.rs"

[dependencies]
secret-proto = { path = "../secret-proto", features = ["server"] }
anyhow.workspace = true
async-trait = "0.1"
base64 = "0.22"
clap.workspace = true
getrandom = "0.2"
libc.workspace = true
nix = { version = "0.29", default-features = false, features = ["user", "fs"] }
serde.workspace = true
subtle = "2"
serde_json.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
secret-client = { path = "../secret-client" }
