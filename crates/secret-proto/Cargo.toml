[package]
name = "secret-proto"
description = "Shared JSON-RPC types, framing, store format and configuration for secretd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Server-side pieces: age store, configuration, ACL evaluation, memory hardening.
server = ["dep:age", "dep:toml", "dep:nix", "dep:url", "dep:libc", "dep:getrandom"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
base64 = "0.22"
age = { version = "0.11", optional = true }
toml = { version = "0.8", optional = true }
nix = { version = "0.29", default-features = false, features = ["user"], optional = true }
url = { version = "2", optional = true }
libc = { workspace = true, optional = true }
getrandom = { version = "0.2", optional = true }
unicode-general-category = "1.1.0"

[dev-dependencies]
tempfile.workspace = true
