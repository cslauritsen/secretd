[workspace]
resolver = "2"
members = [
    "crates/secret-proto",
    "crates/secret-client",
    "crates/secretd",
    "crates/secretctl",
    "crates/secret",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
zeroize = { version = "1", features = ["serde", "derive"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
libc = "0.2"

[profile.release]
lto = "thin"
