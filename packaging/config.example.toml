# /etc/secretd/config.toml
#
# Ownership: root:secretd, mode 0640 (secretd refuses a config that is not owned by
# root, the invoking user or `daemon.user`, or that is group/world writable). The config
# holds no credentials; the files it points to (tokens, OIDC client secret) are
# secretd:secretd 0400, NOT readable by the socket group secretd-clients.
# Reload ACLs, limits and timeouts with `systemctl reload secretd` (SIGHUP). Changes to
# sockets, the listen address, notifier and OIDC settings need a restart.

[daemon]
user = "secretd"
socket = "/run/secretd/secretd.sock"
admin_socket = "/run/secretd/admin.sock"
store = "/var/lib/secretd/store.age"
audit_log = "/var/log/secretd/audit.jsonl"
# Server-side maximum (and default) wait for owner approval, in seconds.
request_timeout_secs = 300
# Client socket mode and group when secretd binds the socket itself (both ignored
# under socket activation, where the .socket unit decides: SocketMode=/SocketGroup=).
# Members of socket_group may connect. Use a dedicated group, never the group that can
# read /etc/secretd. 0o660 or 0o666.
socket_mode = 0o660
socket_group = "secretd-clients"

[limits]
max_pending_per_uid = 3
max_pending_total = 32
max_gets_per_uid_per_min = 10
max_conns_per_uid = 8
max_conns_total = 128
idle_timeout_secs = 30
# A client connection is closed after this many rejections (rate limit, ACL miss,
# changed caller, malformed request) that never reached the owner.
max_rejections_per_conn = 8
# Idle timeout of an admin socket connection (`secretctl approve` waits for you to
# type the passphrase on this connection).
admin_idle_timeout_secs = 600

# Approval channels (default: web + admin). Add "homeassistant" to approve from a Home
# Assistant notification (see [homeassistant] below and the README). With "web" disabled,
# [notify], [approval] and [approval.oidc] are not needed.
# [channels]
# enabled = ["web", "admin", "homeassistant"]

[notify]
# "ntfy" (POST to a topic URL) or "webhook" (JSON POST, optionally HMAC signed).
kind = "ntfy"
url = "https://ntfy.example.com/secretd-alerts"
# Bearer token for ntfy, read from a file (never inline). Owned by secretd, mode 0400
# (or deliver it with systemd LoadCredential=): only the daemon user may read it.
auth_token_file = "/etc/secretd/ntfy.token"
# For kind = "webhook": file with the HMAC-SHA256 key used for X-Secretd-Signature.
# hmac_secret_file = "/etc/secretd/webhook.key"
timeout_secs = 10
attempts = 3          # total tries, with exponential backoff
backoff_ms = 500
priority = "high"

[approval]
# Plain HTTP on loopback; TLS is the reverse proxy's job (see README).
listen = "127.0.0.1:8443"
# Mandatory. Used for approval links, the OIDC redirect URI and the Secure cookie flag.
external_url = "https://secretd.example.com"
# Only peers in this list may supply X-Forwarded-For.
trusted_proxies = ["127.0.0.1/32", "::1/128"]
# Needed only if the proxy is on another host / container network. Logs a warning.
# allow_non_loopback = true
# Failed approval/login attempts per source IP per minute before HTTP 429.
max_failed_attempts_per_min = 5
# /auth/login starts per source IP per minute before HTTP 429.
max_login_starts_per_min = 10
# Connection cap, header-read timeout and per-request timeout of the listener. The
# request timeout must comfortably exceed one scrypt unseal (about 1 s by default).
max_connections = 64
header_read_timeout_secs = 10
request_timeout_secs = 30

[approval.oidc]
issuer = "https://accounts.google.com"
client_id = "xxxxxxxx.apps.googleusercontent.com"
# secretd:secretd 0400
client_secret_file = "/etc/secretd/oidc-client-secret"
# Defaults to <external_url>/auth/callback; must be registered in Google Cloud Console.
redirect_url = "https://secretd.example.com/auth/callback"
# Case-insensitive exact match on the verified `email` claim.
owner_emails = ["owner@example.com"]
session_ttl_secs = 3600

# Home Assistant channel (enable it in [channels] above). The passphrase transits HA: read
# "Home Assistant channel" in the README (recorder/history/logbook exclusion!) first.
# [homeassistant]
# url = "https://homeassistant.example.com:8123"   # http:// needs allow_insecure_http (or loopback)
# token_file = "/etc/secretd/ha.token"             # secretd:secretd 0400
# notify_service = "notify.mobile_app_owner_phone"
# passphrase_entity = "input_text.secretd_passphrase"   # input_text, mode: password, max: 255
# owner_user_ids = ["0123456789abcdef0123456789abcdef"] # context.user_id of the owner's phone
# allow_insecure_http = false
# ca_file = "/etc/secretd/ha-ca.pem"
# ha_require_user_id = true

# One block per secret. Names: [A-Za-z0-9._/-]+. A secret with no allow_uids/allow_gids
# is unreachable. allow_exes must be absolute; allow_any_exe = true is the only way to
# omit it (a warning is logged).
[[secret]]
name = "db-password"
description = "Primary DB password"          # shown to the owner
allow_uids = [1000]                          # numbers or user names
# allow_gids = ["developers"]               # optional
allow_exes = ["/usr/bin/psql", "/opt/app/bin/app"]

# [[secret]]
# name = "deploy-token"
# allow_uids = ["deploy"]
# allow_any_exe = true

# Named-pipe secrets: a legacy program reads a secret by opening a pipe. Opening it triggers
# the normal notification/approval flow; on approval the raw value is written to the pipe and
# the pipe is closed (EOF). The reader blocks meanwhile (up to request_timeout_secs).
#
# The daemon must be able to open the pipe for WRITING: be the owner (default) with the owner
# write bit, or a member of `group` with the group write bit. The readers get access through
# the group, so the daemon user must also belong to that group (an unprivileged daemon can only
# chgrp to its own groups and chown to itself). Needs the pipe directory: see tmpfiles.d.
# [[fifo]]
# path = "/run/secretd/pipes/db-password"
# secret = "db-password"          # must exist in [[secret]]; several pipes may share one secret
# group = "app"                   # readers' group (secretd must be a member)
# # owner = "secretd"             # default: the daemon user
# mode = "0640"                   # octal string; at most 0660 (default 0640)
# enforce_acl = false             # true: the single identified reader must pass the secret's ACL
# attempts_per_min = 10           # reader detections per minute before they are refused
# cooldown_secs = 5               # pause after a request before the pipe is armed again
# write_deadline_secs = 5         # time allowed to push the value into the pipe
