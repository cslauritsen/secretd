# Parent directory of the sockets: 0755, owned by the secretd user.
d /run/secretd 0755 secretd secretd -
# Directory for [[fifo]] named pipes (secretd creates the pipes in it): owned by the daemon
# user and not writable by anyone else, mode 0711 so a reader may open a pipe by its known
# path without being able to list the directory. The pipe's own owner/group/mode is the gate.
d /run/secretd/pipes 0711 secretd secretd -
# Alternative to letting secretd create a pipe: have systemd create it (owner = the daemon,
# group = the readers' group, which secretd must be a member of; secretd then takes it over).
# p /run/secretd/pipes/db-password 0640 secretd app -
